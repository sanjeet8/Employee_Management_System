{% extends "base.html" %}

{% block title %}
Update Department
{% endblock %}

{% block content %}

<h2>Update Department</h2>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save Changes
    </button>

    <a href="{% url 'departments:department-detail' department.pk %}">
        Cancel
    </a>

</form>

{% endblock %}
