{% extends "base.html" %}

{% block content %}

<h2>Create Employee</h2>

<form method="post">
    {% csrf_token %}
    {% include "employees/_form.html" with button_text="Create Employee" %}

</form>

{% if user.is_superuser or user.groups.all.0.name == "HR" %}
    <a href="{% url 'employees:employee-create' %}">
        Add Employee
    </a>
{% endif %}

{% endblock %}
