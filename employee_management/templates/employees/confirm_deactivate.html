{% extends "base.html" %}

{% block content %}

<h2>Deactivate Employee</h2>

<p>
    Are you sure you want to deactivate
    <strong>{{ employee.user.get_full_name }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        Yes, Deactivate
    </button>

    <a href="{% url 'employees:employee-detail' employee.pk %}">
        Cancel
    </a>

</form>

{% endblock %}
